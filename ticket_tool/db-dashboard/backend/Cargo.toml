[package]
name = "db-dashboard-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
duckdb = { version = "1.1", features = ["bundled", "parquet"] }
tempfile = "3"
arrow = "54"
parquet = "54"
env_logger = "0.11"
log = "0.4"
thiserror = "2"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2"
